{% extends "base.html" %}

{% block title %}
UUID Generator | Developer Productivity Suite
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <a href="{{ url_for(
                'tools.category_detail',
                slug='security-tools'
            ) }}"
               class="btn btn-outline-secondary mb-4">

                <i class="bi bi-arrow-left me-1"></i>
                Security Tools

            </a>


            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-lg-5">

                    <div class="text-center mb-4">

                        <div class="tool-icon mx-auto mb-3">
                            <i class="bi bi-fingerprint"></i>
                        </div>

                        <h1 class="fw-bold">
                            UUID Generator
                        </h1>

                        <p class="text-secondary">
                            Generate UUID version 1 or version 4 identifiers.
                        </p>

                    </div>


                    <form method="POST">

                        <div class="row g-3 mb-4">

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    UUID Version
                                </label>

                                <select
                                    class="form-select"
                                    name="version">

                                    <option value="4"
                                        {% if version == "4" %}
                                        selected
                                        {% endif %}>
                                        Version 4
                                    </option>

                                    <option value="1"
                                        {% if version == "1" %}
                                        selected
                                        {% endif %}>
                                        Version 1
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Number of UUIDs
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    name="count"
                                    min="1"
                                    max="100"
                                    value="{{ count }}"
                                    required>

                            </div>

                        </div>


                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-fingerprint me-1"></i>

                            Generate UUIDs

                        </button>

                    </form>


                    {% if error %}

                    <div class="alert alert-danger mt-4">
                        {{ error }}
                    </div>

                    {% endif %}


                    {% if result %}

                    <div class="mt-4">

                        <label class="form-label fw-semibold">
                            Generated UUIDs
                        </label>

                        <textarea
                            class="form-control uuid-output"
                            rows="8"
                            readonly>{% for value in result %}{{ value }}
{% endfor %}</textarea>

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>


<style>

.tool-icon {

    width: 64px;
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background: var(--bs-primary-bg-subtle);
    color: var(--bs-primary);

    font-size: 1.8rem;
}

.uuid-output {

    font-family:
        "Courier New",
        Courier,
        monospace;

}

</style>

{% endblock %}

{% extends "base.html" %}

{% block title %}
Hash Generator | Developer Productivity Suite
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <a href="{{ url_for(
                'tools.category_detail',
                slug='security-tools'
            ) }}"
               class="btn btn-outline-secondary mb-4">

                <i class="bi bi-arrow-left me-1"></i>
                Security Tools

            </a>


            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-lg-5">

                    <div class="text-center mb-4">

                        <div class="tool-icon mx-auto mb-3">
                            <i class="bi bi-hash"></i>
                        </div>

                        <h1 class="fw-bold">
                            Hash Generator
                        </h1>

                        <p class="text-secondary">
                            Generate a hexadecimal digest using common hash algorithms.
                        </p>

                    </div>


                    <form method="POST">

                        <label class="form-label fw-semibold">
                            Input Text
                        </label>

                        <textarea
                            class="form-control mb-3"
                            name="text"
                            rows="7"
                            required>{{ text }}</textarea>


                        <label class="form-label fw-semibold">
                            Algorithm
                        </label>

                        <select
                            class="form-select mb-3"
                            name="algorithm">

                            <option value="md5"
                                {% if algorithm == "md5" %}
                                selected
                                {% endif %}>
                                MD5
                            </option>

                            <option value="sha1"
                                {% if algorithm == "sha1" %}
                                selected
                                {% endif %}>
                                SHA-1
                            </option>

                            <option value="sha224"
                                {% if algorithm == "sha224" %}
                                selected
                                {% endif %}>
                                SHA-224
                            </option>

                            <option value="sha256"
                                {% if algorithm == "sha256" %}
                                selected
                                {% endif %}>
                                SHA-256
                            </option>

                            <option value="sha384"
                                {% if algorithm == "sha384" %}
                                selected
                                {% endif %}>
                                SHA-384
                            </option>

                            <option value="sha512"
                                {% if algorithm == "sha512" %}
                                selected
                                {% endif %}>
                                SHA-512
                            </option>

                        </select>


                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-hash me-1"></i>

                            Generate Hash

                        </button>

                    </form>


                    {% if error %}

                    <div class="alert alert-danger mt-4">
                        {{ error }}
                    </div>

                    {% endif %}


                    {% if result %}

                    <div class="mt-4">

                        <label class="form-label fw-semibold">
                            Hash Result
                        </label>

                        <textarea
                            class="form-control hash-output"
                            rows="4"
                            readonly>{{ result }}</textarea>

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>


<style>

.tool-icon {

    width: 64px;
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background: var(--bs-primary-bg-subtle);
    color: var(--bs-primary);

    font-size: 1.8rem;
}

.hash-output {

    font-family:
        "Courier New",
        Courier,
        monospace;

    word-break: break-all;

}

</style>

{% endblock %}

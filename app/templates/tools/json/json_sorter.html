{% extends "base.html" %}

{% block title %}
JSON Sorter | Developer Productivity Suite
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="mb-4">

                <a href="{{ url_for(
                    'tools.category_detail',
                    slug='json-tools'
                ) }}"
                   class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-left me-1"></i>
                    JSON Tools

                </a>

            </div>


            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-lg-5">

                    <div class="text-center mb-4">

                        <div class="tool-icon mx-auto mb-3">

                            <i class="bi bi-sort-alpha-down"></i>

                        </div>

                        <h1 class="fw-bold">
                            JSON Sorter
                        </h1>

                        <p class="text-secondary">
                            Sort JSON object keys alphabetically.
                        </p>

                    </div>


                    <form method="POST">

                        <label class="form-label fw-semibold">
                            JSON Input
                        </label>

                        <textarea
                            class="form-control code-input mb-3"
                            name="text"
                            rows="14"
                            required>{{ text }}</textarea>


                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-sort-alpha-down me-1"></i>

                            Sort JSON

                        </button>

                    </form>


                    {% if error %}

                    <div class="alert alert-danger mt-4">

                        <i class="bi bi-exclamation-triangle me-2"></i>

                        {{ error }}

                    </div>

                    {% endif %}


                    {% if result is not none %}

                    <div class="mt-4">

                        <label class="form-label fw-semibold">
                            Sorted JSON
                        </label>

                        <textarea
                            class="form-control code-input"
                            rows="14"
                            readonly>{{ result }}</textarea>

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>


<style>

.tool-icon {

    width: 64px;
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background: var(--bs-primary-bg-subtle);
    color: var(--bs-primary);

    font-size: 1.8rem;
}

.code-input {

    font-family:
        "Courier New",
        Courier,
        monospace;

}

</style>

{% endblock %}

{% extends "base.html" %}

{% block title %}
CSS Minifier | Developer Productivity Suite
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <a href="{{ url_for(
                'tools.category_detail',
                slug='css-tools'
            ) }}"
               class="btn btn-outline-secondary mb-4">

                <i class="bi bi-arrow-left me-1"></i>
                CSS Tools

            </a>


            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-lg-5">

                    <div class="text-center mb-4">

                        <div class="tool-icon mx-auto mb-3">
                            <i class="bi bi-filetype-css"></i>
                        </div>

                        <h1 class="fw-bold">
                            CSS Minifier
                        </h1>

                        <p class="text-secondary">
                            Remove unnecessary whitespace and comments from CSS.
                        </p>

                    </div>


                    <form method="POST">

                        <label class="form-label fw-semibold">
                            CSS Input
                        </label>

                        <textarea
                            class="form-control code-input mb-3"
                            name="text"
                            rows="14"
                            placeholder=".container { color: red; padding: 20px; }"
                            required>{{ text }}</textarea>


                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-arrows-collapse me-1"></i>
                            Minify CSS

                        </button>

                    </form>


                    {% if error %}

                    <div class="alert alert-danger mt-4">
                        {{ error }}
                    </div>

                    {% endif %}


                    {% if result is not none %}

                    <div class="mt-4">

                        <label class="form-label fw-semibold">
                            Minified CSS
                        </label>

                        <textarea
                            class="form-control code-input"
                            rows="8"
                            readonly>{{ result }}</textarea>

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>


<style>

.tool-icon {
    width: 64px;
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background: var(--bs-primary-bg-subtle);
    color: var(--bs-primary);

    font-size: 1.8rem;
}

.code-input {
    font-family:
        "Courier New",
        Courier,
        monospace;
}

</style>

{% endblock %}

{% extends "base.html" %}

{% block title %}
Character Counter | Developer Productivity Suite
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="mb-4">
                <a href="{{ url_for('tools.category_detail',
                                    slug='text-tools') }}"
                   class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Text Tools
                </a>
            </div>

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-lg-5">

                    <div class="text-center mb-4">

                        <div class="tool-icon mx-auto mb-3">
                            <i class="bi bi-123"></i>
                        </div>

                        <h1 class="fw-bold">
                            Character Counter
                        </h1>

                        <p class="text-secondary">
                            Count characters with or without spaces.
                        </p>

                    </div>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Enter Text
                            </label>

                            <textarea
                                class="form-control"
                                name="text"
                                rows="10"
                                placeholder="Type or paste your text..."
                                required>{{ text }}</textarea>

                        </div>

                        <div class="form-check mb-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="include_spaces"
                                id="include_spaces"
                                {% if include_spaces %}checked{% endif %}>

                            <label class="form-check-label"
                                   for="include_spaces">
                                Include spaces
                            </label>

                        </div>

                        <button type="submit"
                                class="btn btn-primary">
                            <i class="bi bi-calculator"></i>
                            Count Characters
                        </button>

                    </form>

                    {% if result is not none %}

                    <div class="alert alert-success mt-4">

                        <strong>Character Count:</strong>
                        {{ result }}

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>

<style>
.tool-icon {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: var(--bs-primary-bg-subtle);
    color: var(--bs-primary);
    font-size: 1.8rem;
}
</style>

{% endblock %}
